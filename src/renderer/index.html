<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Zeig, was du kannst!</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="titlebar-spacer"></div>
    <div class="brand">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#1a1a1a"/></svg>
      </div>
      <div class="brand-text"><b>Zeig, was du kannst!</b><span>Projektbegleitung</span></div>
    </div>
    <div class="nav">
      <div class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Übersicht
      </div>
    </div>
    <div class="nav-sep"></div>
    <div class="nav-label">Diese Gruppe</div>
    <div id="groupSubnav"></div>
    <div class="sidebar-foot">
      <div class="avatar" id="avatarInitials">L</div>
      <div><b id="lehrkraftName">Lehrkraft</b><span id="schuleLabel">Schule</span></div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="crumb" id="crumb">Übersicht</div>
      <div class="topbar-right">
        <span class="schoolyear-pill" id="schuljahrPill">Schuljahr</span>
        <button class="btn btn-primary" id="newGroupBtn">+ Neue Gruppe</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>

<script src="renderer.js"></script>
</body>
</html>
