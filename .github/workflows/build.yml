name: Build & sign installers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  test:
    name: Logik-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  build-windows:
    name: Windows-Installer bauen
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: electron-builder (Windows)
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  build-mac:
    name: macOS-Installer bauen
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: electron-builder (macOS)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            release/*.dmg
            release/*.zip

  release:
    name: GitHub-Release mit Installern erstellen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-installer/*.exe
            dist/mac-installer/*.dmg
            dist/mac-installer/*.zip