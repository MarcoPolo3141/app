name: Build & sign installers

# Läuft automatisch, wenn ein Versions-Tag gepusht wird (z.B. v1.1.0),
# und kann zusätzlich manuell über "Run workflow" gestartet werden.
# Nur ein Tag-Push erzeugt einen echten GitHub-Release: eine feste Seite,
# auf der immer die aktuellen Installer zum Download bereitstehen. Kolleg:innen
# laden den Installer von dort herunter und führen ihn aus – er installiert
# sich dann über eine ggf. vorhandene ältere Version (kein separates Auto-Update
# in der App nötig).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  test:
    name: Logik-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  build-windows:
    name: Windows-Installer bauen
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: electron-builder (Windows)
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 5

  build-mac:
    name: macOS-Installer bauen
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: electron-builder (macOS)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 5

  release:
    name: GitHub-Release mit Installern erstellen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-installer/*.exe
            dist/mac-installer/*.dmg
            dist/mac-installer/*.zip